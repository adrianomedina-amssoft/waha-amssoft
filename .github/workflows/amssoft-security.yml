name: AMS SOFT security checks
on:
  push:
    branches: [amssoft/status-security]
  pull_request:
    branches: [core]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn exec tsc --noEmit --incremental false
      - run: yarn test:unit --runInBand --runTestsByPath src/utils/fetch.test.ts src/utils/fetch.deadline.test.ts src/nestjs/ws/AuthorizedDelivery.test.ts src/core/services/SessionService.security.test.ts src/api/sessions.security.test.ts
